<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event Registration</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    padding: 20px;
}

form {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

h2 {
    color: white;
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
}

label {
    display: block;
    color: #cbd5e1;
    margin-top: 15px;
    margin-bottom: 8px;
    font-weight: 600;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #334155;
    border-radius: 10px;
    background: #1e293b;
    color: white;
    font-size: 15px;
    transition: 0.2s;
}

input:focus,
select:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.25);
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(59,130,246,0.3);
}

.message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    background: rgba(34,197,94,0.15);
    color: #86efac;
    font-weight: 600;
}
</style>
</head>

<body>

<form method="post">
    <h2>🎟️ Event Registration</h2>

    <label>Password</label>
    <input name="password" type="password" placeholder="Enter password">

    <label>Event</label>
    <select name="event">
		<option value="1">Chess Tournament (shard1)</option>
		<option value="2">Board Game Night (shard1)</option>
		<option value="3">Movie Marathon (shard1)</option>

		<option value="4">Cake Baking Contest (shard2)</option>
		<option value="5">FIFA Tournament (shard2)</option>
		<option value="6">General Knowledge Quiz (shard2)</option>
		<option value="7">Charity Run (shard2)</option>

		<option value="8">Family Picnic (shard3)</option>
		<option value="9">Talent Show (shard3)</option>
		<option value="10">Night Sky Watching (shard3)</option>
    </select>

    <button type="submit">Register</button>

    {% if message %}
    <div class="message">
        {{ message }}
    </div>
    {% endif %}
</form>

</body>
</html>
