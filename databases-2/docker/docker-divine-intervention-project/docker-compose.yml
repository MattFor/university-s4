services:
  mysql:
    build: ./mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  cfg:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfgRS", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27019:27017"

  shard1:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard1RS", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27101:27017"

  shard2:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard2RS", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27102:27017"

  shard3:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard3RS", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27103:27017"

  mongos:
    image: mongo:7
    command: ["mongos", "--configdb", "cfgRS/cfg:27017", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    depends_on:
      - cfg
      - shard1
      - shard2
      - shard3

  mongo-init:
    image: mongo:7
    depends_on:
      - mongos
      - cfg
      - shard1
      - shard2
      - shard3
    volumes:
      - ./mongo-init/init-sharding.sh:/init-sharding.sh
    entrypoint: ["bash", "/init-sharding.sh"]

  web:
    build: ./web
    env_file:
      - .env
    ports:
      - "9001:9001"
    depends_on:
      mysql:
        condition: service_healthy

  logger:
    build: ./logger
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      mongos:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
